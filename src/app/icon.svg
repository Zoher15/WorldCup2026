<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="World Cup 2026">
  <defs>
    <!-- The brand sweep: flame → grape → ocean, the same stops as
         .gradient-text / .gradient-accent in globals.css. Diagonal so the
         disc reads as lit from the top-left even at 16px. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a36"/>
      <stop offset="50%" stop-color="#6b2fb3"/>
      <stop offset="100%" stop-color="#1e8fd5"/>
    </linearGradient>
  </defs>
  <!-- Dark stadium base (≈#1c1917) so the gradient disc has a frame and the
       icon never bleeds into a dark OS background. -->
  <rect width="100" height="100" rx="22" fill="#1c1917"/>
  <!-- Gradient disc. -->
  <circle cx="50" cy="50" r="33" fill="url(#brand)"/>
  <!-- Soccer-ball mark: a central dark pentagon with five short seams reaching
       toward the rim. Bold, geometric shapes (not hairlines) so the ball stays
       legible at 16–32px. -->
  <g fill="#1c1917">
    <!-- Centre pentagon (point up). -->
    <polygon points="50,33 63.3,42.7 58.2,58.4 41.8,58.4 36.7,42.7"/>
    <!-- Five seams radiating from the pentagon vertices to the rim. -->
    <g stroke="#1c1917" stroke-width="4.2" stroke-linecap="round">
      <line x1="50" y1="33" x2="50" y2="20"/>
      <line x1="63.3" y1="42.7" x2="74" y2="35.5"/>
      <line x1="58.2" y1="58.4" x2="66.5" y2="70"/>
      <line x1="41.8" y1="58.4" x2="33.5" y2="70"/>
      <line x1="36.7" y1="42.7" x2="26" y2="35.5"/>
    </g>
  </g>
</svg>
