<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="World Cup 2026">
  <defs>
    <!-- Same flame → grape → ocean brand stops as icon.svg / globals.css. -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a36"/>
      <stop offset="50%" stop-color="#6b2fb3"/>
      <stop offset="100%" stop-color="#1e8fd5"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed dark stadium base; iOS applies its own corner mask, so no
       rounded-rect here (square fill keeps the home-screen tile edge-to-edge). -->
  <rect width="180" height="180" fill="#1c1917"/>
  <circle cx="90" cy="90" r="60" fill="url(#brand)"/>
  <g fill="#1c1917">
    <polygon points="90,57 114,75.5 104.8,104.1 75.2,104.1 66,75.5"/>
    <g stroke="#1c1917" stroke-width="7.6" stroke-linecap="round">
      <line x1="90" y1="57" x2="90" y2="33"/>
      <line x1="114" y1="75.5" x2="133.2" y2="62.5"/>
      <line x1="104.8" y1="104.1" x2="119.7" y2="125"/>
      <line x1="75.2" y1="104.1" x2="60.3" y2="125"/>
      <line x1="66" y1="75.5" x2="46.8" y2="62.5"/>
    </g>
  </g>
</svg>
